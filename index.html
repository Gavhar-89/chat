<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatly — zamonaviy chat</title>
<style>
:root{--bg:#0c1220;--panel:#121b2d;--panel2:#18243a;--line:#26344d;--text:#edf3ff;--muted:#91a1bb;--accent:#6c7cff;--accent2:#4c5ee8;--mine:#4658d9;--bubble:#202d43;--green:#39d6a2;--shadow:0 24px 70px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#253568 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{width:min(1200px,100%);height:min(800px,calc(100vh - 40px));min-height:560px;display:grid;grid-template-columns:330px 1fr;background:#10192aee;border:1px solid #ffffff12;border-radius:25px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(18px);animation:appear .45s ease-out}
.sidebar{background:#10192b;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:12px;padding:23px 22px 18px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#8994ff,#5363ef);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 24px #5968f355}.brand h1{font-size:21px;margin:0;letter-spacing:-.6px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.search-wrap{padding:0 16px 15px;position:relative}.search-wrap input{width:100%;background:#1a263b;border:1px solid transparent;border-radius:13px;padding:12px 13px 12px 39px;color:var(--text);outline:none;transition:.2s}.search-wrap input:focus{border-color:#6574ff;box-shadow:0 0 0 3px #6574ff22}.search-icon{position:absolute;left:29px;top:11px;color:var(--muted)}.section-label{padding:0 20px 10px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:750}.section-label button{background:transparent;color:#98a7ff;font-size:12px;text-transform:none;letter-spacing:0}.chat-list{overflow:auto;padding:0 9px 12px;flex:1}.chat-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;background:transparent;border-radius:15px;text-align:left;transition:background .2s,transform .2s;margin-bottom:3px}.chat-item:hover{background:#1a263b;transform:translateX(2px)}.chat-item.active{background:linear-gradient(110deg,#27365a,#202d49)}.avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:15px;color:white;position:relative;background:linear-gradient(135deg,#ff9b7a,#e65d88)}.avatar.purple{background:linear-gradient(135deg,#b48bff,#7256e9)}.avatar.blue{background:linear-gradient(135deg,#60c9ff,#3878df)}.avatar.green{background:linear-gradient(135deg,#5de0b5,#199b83)}.avatar.gold{background:linear-gradient(135deg,#ffd36c,#ee8b45)}.online-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--green);right:-1px;bottom:0;border:2px solid #152036}.chat-meta{min-width:0;flex:1}.chat-top{display:flex;align-items:center;justify-content:space-between;gap:6px}.chat-name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font-size:10px;color:var(--muted);white-space:nowrap}.chat-preview{color:var(--muted);font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--accent);border-radius:20px;padding:2px 6px;font-size:10px;font-weight:800}.profile{padding:14px 17px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.profile .avatar{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#6c7cff,#3c49b8)}.profile-info{flex:1}.profile-info b{font-size:12px;display:block}.profile-info small{font-size:10px;color:var(--green)}.icon-btn{width:36px;height:36px;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:.2s}.icon-btn:hover{background:#ffffff12;color:white;transform:scale(1.05)}
.main{display:flex;flex-direction:column;min-width:0;background:linear-gradient(150deg,#131d30,#0f1728)}.topbar{height:84px;display:flex;align-items:center;padding:0 25px;border-bottom:1px solid var(--line);gap:13px}.topbar .avatar{width:44px;height:44px;border-radius:15px}.contact{flex:1;min-width:0}.contact b{display:block;font-size:14px}.contact small{display:block;color:var(--green);font-size:11px;margin-top:5px}.top-actions{display:flex;gap:5px}.mobile-back{display:none}.messages{flex:1;overflow:auto;padding:26px clamp(14px,4vw,48px);display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}.day-chip{align-self:center;background:#26334b;color:#aebbd1;border-radius:20px;padding:6px 13px;font-size:10px;margin-bottom:8px}.message-row{display:flex;flex-direction:column;max-width:min(76%,480px);animation:slideUp .25s ease-out}.message-row.mine{align-self:flex-end;align-items:flex-end}.message-row.theirs{align-self:flex-start;align-items:flex-start}.sender{font-size:10px;color:#a4b3ff;margin:0 0 5px 8px}.bubble{background:var(--bubble);padding:12px 15px;border-radius:17px 17px 17px 5px;font-size:13px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.mine .bubble{background:linear-gradient(135deg,#5365ed,#3d4fcb);border-radius:17px 17px 5px 17px}.message-bottom{display:flex;align-items:center;gap:5px;font-size:9px;color:#8797b1;margin:5px 5px 0}.mine .message-bottom{justify-content:flex-end}.ticks{color:#8ddff8;font-size:11px}.typing{display:none;align-self:flex-start;background:var(--bubble);border-radius:15px;padding:11px 14px;gap:4px}.typing.show{display:flex}.typing span{width:5px;height:5px;background:#91a1bb;border-radius:50%;animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}.composer-wrap{padding:13px 22px 20px;border-top:1px solid var(--line);background:#10192bd9}.composer{display:flex;align-items:flex-end;gap:10px;background:#1a263b;border:1px solid #2a3955;border-radius:17px;padding:8px 9px;transition:.2s}.composer:focus-within{border-color:#6877ff;box-shadow:0 0 0 3px #6877ff18}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);padding:10px 3px;font-size:13px}.composer input::placeholder{color:#7f8da7}.send-btn{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#7d89ff,#5362e9);display:grid;place-items:center;box-shadow:0 7px 18px #5968f344;transition:.2s}.send-btn:hover{transform:translateY(-2px) rotate(-3deg);box-shadow:0 10px 24px #5968f355}.send-btn:active{transform:scale(.94)}.composer-tools{display:flex;align-items:center;gap:3px}.hint{text-align:center;color:#71819b;font-size:10px;margin-top:9px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}.empty-icon{font-size:40px;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#263650;color:white;padding:11px 16px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);transition:.25s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#030713b8;display:none;place-items:center;padding:18px;z-index:20;backdrop-filter:blur(5px)}.modal-backdrop.show{display:grid;animation:appear .2s}.modal{width:min(390px,100%);background:#172238;border:1px solid #ffffff17;border-radius:22px;padding:23px;box-shadow:var(--shadow);animation:slideUp .25s}.modal h2{font-size:19px;margin:0 0 6px}.modal p{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.5}.modal input{width:100%;padding:12px;border-radius:12px;background:#0e1728;border:1px solid #30405d;color:white;outline:none;margin-bottom:12px}.modal input:focus{border-color:#6c7cff}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.btn{padding:10px 14px;border-radius:11px;font-size:12px;font-weight:750}.btn.secondary{background:#26344b}.btn.primary{background:var(--accent)}.emoji-menu{display:none;position:absolute;bottom:85px;left:25px;background:#202d43;border:1px solid #34425b;border-radius:15px;padding:9px;grid-template-columns:repeat(6,35px);gap:4px;box-shadow:var(--shadow);z-index:4}.emoji-menu.show{display:grid;animation:slideUp .18s}.emoji-menu button{font-size:21px;background:transparent;border-radius:8px;padding:4px}.emoji-menu button:hover{background:#ffffff15}
@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@media(max-width:700px){body{padding:0;display:block}.app{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;grid-template-columns:1fr}.sidebar{grid-column:1;grid-row:1;border-right:0;height:100dvh}.main{display:none;height:100dvh;grid-column:1;grid-row:1}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.brand{padding-top:19px}.topbar{height:75px;padding:0 13px}.mobile-back{display:grid}.top-actions .icon-btn:nth-child(2){display:none}.messages{padding:20px 15px}.message-row{max-width:88%}.composer-wrap{padding:11px 12px calc(12px + env(safe-area-inset-bottom))}.hint{display:none}.emoji-menu{bottom:78px;left:12px}.profile{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="brand"><div class="logo">✦</div><div><h1>chatly<span style="color:#8b96ff">.</span></h1><small>Har doim aloqada</small></div><button class="icon-btn" id="newChatBtn" title="Yangi chat" style="margin-left:auto;font-size:22px">＋</button></div>
  <div class="search-wrap"><span class="search-icon">⌕</span><input id="searchInput" placeholder="Chatlarni qidirish..." autocomplete="off"></div>
  <div class="section-label"><span>Barcha xabarlar</span><button id="sortBtn">Eng so‘nggi ↕</button></div>
  <div class="chat-list" id="chatList"></div>
  <div class="profile"><div class="avatar">S</div><div class="profile-info"><b id="profileName">Sizning profilingiz</b><small>● Online</small></div><button class="icon-btn" id="profileBtn" title="Ismni o‘zgartirish">⚙</button></div>
 </aside>
 <main class="main">
  <header class="topbar"><button class="icon-btn mobile-back" id="backBtn" aria-label="Orqaga">←</button><div class="avatar purple" id="activeAvatar">M</div><div class="contact"><b id="activeName">Madina Karimova</b><small id="activeStatus">● Online</small></div><div class="top-actions"><button class="icon-btn" id="searchInChat" title="Suhbatni qidirish">⌕</button><button class="icon-btn" id="infoBtn" title="Suhbat haqida">ⓘ</button></div></header>
  <section class="messages" id="messages" aria-live="polite"></section>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="composer-wrap"><div class="emoji-menu" id="emojiMenu"></div><form class="composer" id="messageForm"><div class="composer-tools"><button type="button" class="icon-btn" id="emojiBtn" title="Emoji">☺</button><button type="button" class="icon-btn" id="attachBtn" title="Demo biriktirma">＋</button></div><input id="messageInput" placeholder="Xabar yozing..." autocomplete="off" maxlength="2000"/><button class="send-btn" type="submit" title="Yuborish" aria-label="Xabar yuborish"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form><div class="hint">Enter — yuborish · Xabarlar ushbu brauzerda saqlanadi</div></div>
 </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">Yangi suhbat</h2><p id="modalDesc">Suhbat uchun ism kiriting.</p><form id="modalForm"><input id="modalInput" maxlength="35" placeholder="Masalan, Ali" required/><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">Bekor qilish</button><button type="submit" class="btn primary" id="confirmModal">Yaratish</button></div></form></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);const STORAGE='chatly_demo_v1';
const palette=['','purple','blue','green','gold'];
const seed=[
 {id:'madina',name:'Madina Karimova',initial:'M',color:'purple',online:true,unread:2,messages:[{from:'them',text:'Salom! 😊 Bugun qalaysan?',time:'10:24'},{from:'me',text:'Salom! Yaxshi, rahmat. O‘zingchi?',time:'10:25'},{from:'them',text:'Men ham yaxshi! Yangi loyiha haqida gaplashamizmi?',time:'10:26'}]},
 {id:'ali',name:'Ali Xasanov',initial:'A',color:'blue',online:true,unread:0,messages:[{from:'them',text:'Fayllarni oldim, rahmat!',time:'09:52'}]},
 {id:'dostlar',name:'Do‘stlar guruhi',initial:'D',color:'green',online:false,unread:4,messages:[{from:'them',text:'Jasur: Bugun uchrashamizmi?',time:'Kecha'}]},
 {id:'aziza',name:'Aziza Rahimova',initial:'A',color:'gold',online:false,unread:0,messages:[{from:'them',text:'Zo‘r fikr ekan ✨',time:'Kecha'}]},
 {id:'bot',name:'Chatly yordamchi',initial:'✦',color:'purple',online:true,unread:0,messages:[{from:'them',text:'Xush kelibsiz! Bu demo chat. Yangi suhbat ochishingiz va xabarlarni sinab ko‘rishingiz mumkin.',time:'09:00'}]}
];
let chats=[],activeId=null,userName='Sizning profilingiz',sortNewest=true,modalMode='new';
function now(){return new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({chats,activeId,userName}));}catch(e){toast('Saqlash imkoni bo‘lmadi.');}}
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE));if(d&&Array.isArray(d.chats)&&d.chats.length){chats=d.chats;activeId=d.activeId;userName=d.userName||userName;return;}}catch(e){}chats=seed;activeId='madina';}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2300);}
function active(){return chats.find(c=>c.id===activeId)||chats[0];}
function lastMessage(c){return c.messages[c.messages.length-1]||{text:'Hali xabar yo‘q',time:''};}
function renderList(){const q=$('searchInput').value.trim().toLocaleLowerCase();let arr=chats.filter(c=>c.name.toLocaleLowerCase().includes(q));if(sortNewest)arr.sort((a,b)=>{let am=a.messages.length?a.messages[a.messages.length-1].time:'';let bm=b.messages.length?b.messages[b.messages.length-1].time:'';return (b.messages.length-a.messages.length)||0;});$('chatList').innerHTML=arr.map(c=>{let last=lastMessage(c);let color=palette.includes(c.color)?c.color:'';return `<button class="chat-item ${c.id===activeId?'active':''}" data-id="${escapeHtml(c.id)}"><div class="avatar ${color}">${escapeHtml(c.initial)}${c.online?'<i class="online-dot"></i>':''}</div><div class="chat-meta"><div class="chat-top"><span class="chat-name">${escapeHtml(c.name)}</span><span class="chat-time">${escapeHtml(last.time)}</span></div><div class="chat-top"><div class="chat-preview">${last.from==='me'?'Siz: ':''}${escapeHtml(last.text)}</div>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div></div></button>`}).join('');if(!arr.length)$('chatList').innerHTML='<div style="padding:25px 15px;color:var(--muted);font-size:12px;text-align:center">Hech narsa topilmadi</div>';}
function renderMessages(){const c=active();if(!c)return;$('activeName').textContent=c.name;$('activeAvatar').textContent=c.initial;$('activeAvatar').className='avatar '+(palette.includes(c.color)?c.color:'');$('activeStatus').textContent=c.online?'● Online':'Oxirgi faolligi yaqinda';$('activeStatus').style.color=c.online?'var(--green)':'var(--muted)';$('messages').innerHTML='<div class="day-chip">BUGUN</div>'+c.messages.map(m=>`<div class="message-row ${m.from==='me'?'mine':'theirs'}">${m.from==='them'?`<span class="sender">${escapeHtml(c.name)}</span>`:''}<div class="bubble">${escapeHtml(m.text)}</div><div class="message-bottom"><span>${escapeHtml(m.time)}</span>${m.from==='me'?'<span class="ticks">✓✓</span>':''}</div></div>`).join('')+(!c.messages.length?'<div class="empty"><div class="empty-icon">💬</div><b>Yangi suhbat</b><p>Birinchi xabaringizni yuboring.</p></div>':'');$('messages').scrollTop=$('messages').scrollHeight;}
function render(){renderList();renderMessages();$('profileName').textContent=userName;$('app').classList.toggle('chat-open',window.innerWidth<=700&&!!activeId);}
function openChat(id){activeId=id;const c=active();if(c)c.unread=0;render();save();$('messageInput').focus();}
function send(text){text=text.trim();if(!text)return;const c=active();if(!c)return;c.messages.push({from:'me',text,time:now()});render();save();$('messageInput').value='';$('emojiMenu').classList.remove('show');}
function showModal(mode){modalMode=mode;$('modalTitle').textContent=mode==='new'?'Yangi suhbat':'Profil ismi';$('modalDesc').textContent=mode==='new'?'Yangi suhbat uchun ism kiriting. Bu demo chat ichida ko‘rinadi.':'Chatlarda ko‘rinadigan ismingizni kiriting.';$('modalInput').value=mode==='profile'?userName==='Sizning profilingiz'?'':userName:'';$('confirmModal').textContent=mode==='new'?'Yaratish':'Saqlash';$('modalBackdrop').classList.add('show');setTimeout(()=>$('modalInput').focus(),60);}
$('chatList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openChat(b.dataset.id)});$('searchInput').addEventListener('input',renderList);$('messageForm').addEventListener('submit',e=>{e.preventDefault();send($('messageInput').value)});$('newChatBtn').addEventListener('click',()=>showModal('new'));$('profileBtn').addEventListener('click',()=>showModal('profile'));$('cancelModal').addEventListener('click',()=>$('modalBackdrop').classList.remove('show'));$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))$('modalBackdrop').classList.remove('show')});
$('modalForm').addEventListener('submit',e=>{e.preventDefault();let name=$('modalInput').value.trim();if(!name)return;if(modalMode==='new'){const id='chat_'+Date.now();chats.unshift({id,name,initial:name.slice(0,1).toLocaleUpperCase(),color:palette[1+Math.floor(Math.random()*4)],online:false,unread:0,messages:[]});activeId=id;$('app').classList.add('chat-open');toast('Yangi suhbat yaratildi');}else{userName=name;toast('Profil nomi saqlandi');} $('modalBackdrop').classList.remove('show');render();save();});
$('backBtn').addEventListener('click',()=>{$('app').classList.remove('chat-open')});$('sortBtn').addEventListener('click',()=>{sortNewest=!sortNewest;$('sortBtn').textContent=sortNewest?'Eng so‘nggi ↕':'Odatiy ↕';renderList()});$('infoBtn').addEventListener('click',()=>{const c=active();toast(`${c.name} · ${c.messages.length} ta xabar`) });$('searchInChat').addEventListener('click',()=>{const q=prompt('Suhbatdagi matnni qidiring:');if(q===null||!q.trim())return;const c=active();const found=c.messages.find(m=>m.text.toLocaleLowerCase().includes(q.toLocaleLowerCase()));toast(found?'Mos xabar topildi: '+found.text:'Mos xabar topilmadi')});$('attachBtn').addEventListener('click',()=>toast('Fayl biriktirish haqiqiy server versiyasida qo‘shiladi.'));
const emojis=['😀','😁','😂','😊','😍','🥰','😎','🤔','😭','👍','👏','❤️','🔥','🎉','✨','🙏','💯','😅'];$('emojiMenu').innerHTML=emojis.map(x=>`<button type="button">${x}</button>`).join('');$('emojiBtn').addEventListener('click',()=> $('emojiMenu').classList.toggle('show'));$('emojiMenu').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){$('messageInput').value+=$('messageInput').value?' '+e.target.textContent:e.target.textContent;$('messageInput').focus()}});document.addEventListener('click',e=>{if(!e.target.closest('#emojiMenu')&&!e.target.closest('#emojiBtn'))$('emojiMenu').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('modalBackdrop').classList.remove('show');$('emojiMenu').classList.remove('show')}});window.addEventListener('resize',()=>{if(window.innerWidth>700)$('app').classList.remove('chat-open');else if(activeId)$('app').classList.add('chat-open')});
load();render();
})();
</script>
</body>
</html>
